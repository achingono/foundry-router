[project]
name = "foundry-router"
version = "0.1.0"
description = "Lightweight OpenAI-compatible proxy for Azure AI Foundry deployments with credit-aware routing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Foundry Router Contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["azure", "foundry", "openai", "proxy", "routing", "ai"]

dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=24.1.0,<25.0.0",
    "uvicorn>=0.29.0,<0.30.0",
    "httpx-sse>=0.4.0,<0.5.0",
    "tenacity>=8.2.0,<9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "respx>=0.21.0,<0.22.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "PTH", "PL", "TRY", "SIM", "RET", "ARG", "PERF", "PD", "PGH", "PIE", "TID", "RUF", "EXE", "NPY", "ISC", "ICN", "LOG", "ERA", "FURB", "TCH", "INT", "ASYNC"]
ignore = ["S101", "S106", "S311", "S603", "S607", "TRY003"]
fixable = ["ALL"]
unfixable = ["T10", "TCH", "INT", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG002",
    "E501",
    "PLC0415",
    "PLR2004",
    "PLW1510",
    "RUF043",
    "SIM117",
    "TC002",
]
"src/foundry_router/auth/__init__.py" = ["B008"]
"src/foundry_router/backends/__init__.py" = ["PLW0603"]
"src/foundry_router/config/__init__.py" = ["PLR0912", "PLR0915"]
"src/foundry_router/credit.py" = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "PLR5501",
    "SIM108",
    "SIM114",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
enable_error_code = ["ignore-without-code"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "docker: Docker tests",
]

[tool.coverage.run]
source = ["src/foundry_router"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
